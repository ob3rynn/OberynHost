name: storefront-production

services:
  storefront:
    # Pre-publish contract: `docker compose build storefront` builds this image
    # locally and tags it as STOREFRONT_IMAGE. Later CI should publish the same
    # immutable image reference so the host can pull instead of build.
    image: ${STOREFRONT_IMAGE}
    build:
      context: ../../../apps/storefront
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - ${STOREFRONT_ENV_FILE:-/etc/oberyn/storefront/storefront.env}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /var/lib/oberynhost/storefront/storefront.sqlite3
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT}:3000"
    volumes:
      - ${STOREFRONT_DATA_DIR}:/var/lib/oberynhost/storefront
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/plans').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
